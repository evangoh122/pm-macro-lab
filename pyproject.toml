[project]
name = "pm-macro-lab"
version = "0.1.0"
description = "Prediction-market macro research lab (ForecastEx via IBKR) on Databricks"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "spark: needs a Spark session",
  "databricks: needs a Databricks workspace",
  "live: hits live network or broker APIs",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit so local and CI ruff versions agree (no version-dependent default rules).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
